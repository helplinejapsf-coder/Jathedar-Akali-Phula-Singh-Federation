name: Build JAPSF Admin Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-admin/**'
      - '.github/workflows/build-admin-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Create app launcher icons from Federation logo
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p android-admin/app/src/main/res
          curl -L --fail -o /tmp/federation-logo.png https://raw.githubusercontent.com/helplinejapsf-coder/Jathedar-Akali-Phula-Singh-Federation/main/logo.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Image.open('/tmp/federation-logo.png').convert('RGBA')
          # Fit the complete Federation logo into a square transparent canvas.
          side = max(src.width, src.height)
          canvas = Image.new('RGBA', (side, side), (255, 255, 255, 0))
          canvas.alpha_composite(src, ((side-src.width)//2, (side-src.height)//2))
          sizes = {'mdpi':48, 'hdpi':72, 'xhdpi':96, 'xxhdpi':144, 'xxxhdpi':192}
          root = Path('android-admin/app/src/main/res')
          for density, size in sizes.items():
              folder = root / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              icon = canvas.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png', optimize=True)
              icon.save(folder / 'ic_launcher_round.png', optimize=True)
          PY
      - name: Build debug APK
        working-directory: android-admin
        run: gradle assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JAPSF-Admin-Android-APK
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
