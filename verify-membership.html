<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091326"><meta name="robots" content="noindex,nofollow"><title>Membership Verification | JAPSF</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#17294b 0,#091326 68%);color:#edf3ff;font:16px/1.5 Inter,system-ui,Arial,sans-serif;padding:30px 16px;display:flex;align-items:flex-start;justify-content:center}.card{width:min(100%,620px);margin:16px auto 50px;background:#12213e;border:1px solid #304665;border-top:9px solid #e3b942;border-radius:24px;padding:36px 44px 28px;box-shadow:0 20px 60px #0005}.brand{font-size:clamp(25px,5vw,39px);font-weight:900;line-height:1.2;color:#ffe29a;letter-spacing:.2px}.sub{font-size:17px;color:#b9c7df;margin:18px 0 36px}.status{padding:20px 22px;border-radius:14px;font-size:clamp(17px,3vw,23px);font-weight:850;margin-bottom:38px}.valid{background:#103d35;color:#aaf0d0;border:2px solid #278c75}.invalid{background:#48252c;color:#ffd1d5;border:2px solid #a94b58}.row{display:grid;grid-template-columns:42% 58%;gap:10px;padding:15px 0;border-bottom:1px solid #344867;font-size:clamp(15px,3vw,21px)}.label{color:#b8c7df}.value{text-align:right;overflow-wrap:anywhere;color:#f3f6fc}.foot{text-align:center;color:#9eacc4;margin-top:38px;font-size:14px}.loading,.error{text-align:center;padding:55px 10px;color:#c4d1e6}.small{font-size:12px;color:#9eacc4;text-align:center;margin-top:18px}
@media(max-width:480px){body{padding:12px 10px}.card{padding:26px 22px 24px;border-radius:20px}.sub{margin:14px 0 26px}.status{padding:16px;margin-bottom:26px}.row{grid-template-columns:40% 60%;padding:13px 0}.foot{margin-top:28px}}
</style></head><body><main class="card"><div class="brand">JATHEDAR AKALI PHULA SINGH FEDERATION</div><div class="sub">Official Membership Verification</div><div id="result" class="loading">Verifying membership record…</div><div class="foot">© 2026 Jathedar Akali Phula Singh Federation</div><div class="small">This page displays limited public verification information only.</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script>
(async()=>{const el=document.getElementById("result"),token=new URLSearchParams(location.search).get("token");if(!token){el.className="error";el.textContent="Verification code is missing.";return}try{const sb=supabase.createClient("https://urghiemtxhwhvoaivwge.supabase.co","sb_publishable_a01UQLsq6H2aVwwnoQM1bw_etwuXUJ0");const {data,error}=await sb.functions.invoke("public-member-verification",{body:{token}});if(error||!data){throw Error("Verification service is temporarily unavailable.")}if(data.error&&!data.member){el.className="error";el.textContent=data.message||data.error||"Membership record not found.";return}const status=document.createElement("div");status.className="status "+(data.valid?"valid":"invalid");status.textContent=(data.valid?"✓ ":"✕ ")+(data.label||data.status);el.replaceChildren(status);const m=data.member||{};const rows=[["Member ID",m.member_id],["Name",m.name],["Authority",m.authority],["Issue Date",m.issue_date],["Validity Start",m.validity_start],["Validity End",m.validity_end],["Status",data.status]];for(const [label,value] of rows){if(!value)continue;const row=document.createElement("div");row.className="row";const l=document.createElement("div");l.className="label";l.textContent=label;const v=document.createElement("div");v.className="value";v.textContent=value;row.append(l,v);el.append(row)}}catch(e){el.className="error";el.textContent=e.message||"Unable to verify this membership."}})();
</script></body></html>
